<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>locomotive js</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="main">


        <div id="page1" data-scroll data-scroll-speed=".5">
            <h1 data-scroll data-scroll-speed="3">Welcome to Parallax</h1>
            <p data-scroll data-scroll-speed="3" id="kk">
                Experience smooth scrolling with Locomotive JS and immersive visuals.
            </p>
            <img data-scroll data-scroll-speed="6"   data-scroll data-scroll-class="in-view"
                src="https://media.istockphoto.com/id/523181936/photo/mountain-sunset-golden-light-illuminating-sacred-himalaya-peak-machapuchare-nepal.jpg?s=612x612&w=0&k=20&c=g2C9IunBM36hixedXfv3msQuaFPvj0G8Wi7fBUaoKpc="
                alt="">
        </div>

        <div id="page2" data-scroll data-scroll-speed=".4">
            <img data-scroll data-scroll-speed="-2" data-scroll-direction="horizontal"
                src="https://plus.unsplash.com/premium_photo-1667842850853-c8242bc106a5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDd8fHxlbnwwfHx8fHw%3D"
                alt="">
            <img data-scroll data-scroll-speed="2" data-scroll-direction="horizontal"
                src="https://plus.unsplash.com/premium_photo-1667926195926-b210e1963e2f?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="">
        </div>
        <div id="page3" data-scroll data-scroll-speed=".2">
            <img data-scroll data-scroll-speed="2" data-scroll-direction="horizontal"
                src="https://plus.unsplash.com/premium_photo-1669751812603-4ee6878674b6?q=80&w=688&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="">
            <img data-scroll data-scroll-speed="-2" data-scroll-direction="horizontal"
                src="https://images.unsplash.com/photo-1634380737716-a8c5a1f75659?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="">
        </div>

    </div>




    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.js"></script>
    <script src="main.js"></script>
</body>

</html>
